name: CodeQL
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Initialize JavaScript and TypeScript security analysis
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # verified v4 target
        with:
          languages: javascript-typescript
          build-mode: none
          tools: linked
          queries: security-extended
      - name: Analyze and publish source-bound findings
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: output/security/codeql
          upload: always
          upload-database: false
          wait-for-processing: true
          category: evaro-javascript-typescript
      - name: Reject incomplete evidence and all High or Critical findings
        run: node scripts/security/codeql-gate.cjs output/security/codeql
      - name: Archive review evidence including blocking findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ github.sha }}
          path: output/security/codeql/*.sarif
          if-no-files-found: error
          retention-days: 30
