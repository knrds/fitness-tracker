<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Volt Performance Fitness - Progress/Stats</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#c1f20d",
              "background-light": "#f8f8f5",
              "background-dark": "#0B0B0F",
              "surface": "#1A1C23",
              "text-main": "#F4F5F7",
              "muted": "#2A2B31",
              "accent": "#FF3366",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "body": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: theme('colors.background-dark');
            color: theme('colors.text-main');
        }
        h1, h2, h3, h4, h5, h6, .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-text-main antialiased selection:bg-primary selection:text-background-dark flex flex-col min-h-screen">
<!-- Header -->
<header class="sticky top-0 z-50 bg-background-dark border-b border-muted py-4 px-6">
<div class="flex items-center justify-between">
<h1 class="font-display font-bold text-2xl tracking-tight uppercase">Performance</h1>
<div class="relative w-10 h-10 rounded-full bg-surface border border-muted overflow-hidden">
<div class="w-full h-full bg-gradient-to-tr from-surface to-muted" data-alt="A macro shot of brushed dark metal with an electric green rim light, extremely sharp, modern and minimal"></div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- Segmented Control (Shared Component Logic) -->
<div class="flex px-4 py-6">
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-surface border border-muted p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-background-dark has-[:checked]:text-primary text-gray-400 font-display font-semibold text-sm uppercase transition-colors">
<span class="truncate">1W</span>
<input class="invisible w-0" name="time-range" type="radio" value="1W"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-background-dark has-[:checked]:text-primary text-gray-400 font-display font-semibold text-sm uppercase transition-colors">
<span class="truncate">1M</span>
<input class="invisible w-0" name="time-range" type="radio" value="1M"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-background-dark has-[:checked]:text-primary text-gray-400 font-display font-semibold text-sm uppercase transition-colors">
<span class="truncate">3M</span>
<input checked="" class="invisible w-0" name="time-range" type="radio" value="3M"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-background-dark has-[:checked]:text-primary text-gray-400 font-display font-semibold text-sm uppercase transition-colors">
<span class="truncate">1Y</span>
<input class="invisible w-0" name="time-range" type="radio" value="1Y"/>
</label>
</div>
</div>
<!-- Metric Selector -->
<div class="px-6 mb-4 flex gap-3 overflow-x-auto no-scrollbar">
<button class="px-4 py-2 rounded-full border border-primary text-primary font-display text-xs uppercase tracking-wider whitespace-nowrap bg-primary/10 transition-colors">
                Squat 1RM
            </button>
<button class="px-4 py-2 rounded-full border border-muted text-gray-400 font-display text-xs uppercase tracking-wider whitespace-nowrap hover:bg-surface transition-colors">
                Bench 1RM
            </button>
<button class="px-4 py-2 rounded-full border border-muted text-gray-400 font-display text-xs uppercase tracking-wider whitespace-nowrap hover:bg-surface transition-colors">
                Deadlift 1RM
            </button>
<button class="px-4 py-2 rounded-full border border-muted text-gray-400 font-display text-xs uppercase tracking-wider whitespace-nowrap hover:bg-surface transition-colors">
                Total Vol
            </button>
</div>
<!-- Hero Chart Section -->
<div class="px-6 mb-8">
<div class="bg-surface border border-muted rounded-lg p-6 relative">
<!-- Chart Title/Current Value -->
<div class="flex justify-between items-end mb-8">
<div>
<p class="text-xs font-display text-gray-400 uppercase tracking-widest mb-1">Squat 1RM</p>
<p class="font-display font-bold text-4xl text-text-main tabular-nums">315<span class="text-lg text-gray-500 ml-1">LBS</span></p>
</div>
<div class="flex items-center text-primary font-display text-sm">
<span class="material-symbols-outlined mr-1" style="font-size: 16px;">trending_up</span>
                        +5.0%
                    </div>
</div>
<!-- The Chart (Simulated with SVG and CSS) -->
<div class="h-48 w-full relative group cursor-crosshair">
<!-- Y-Axis Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between">
<div class="border-b border-muted/50 w-full relative">
<span class="absolute -top-3 -left-6 text-[10px] font-display text-gray-500 tabular-nums">320</span>
</div>
<div class="border-b border-muted/50 w-full relative">
<span class="absolute -top-3 -left-6 text-[10px] font-display text-gray-500 tabular-nums">300</span>
</div>
<div class="border-b border-muted/50 w-full relative">
<span class="absolute -top-3 -left-6 text-[10px] font-display text-gray-500 tabular-nums">280</span>
</div>
<div class="border-b border-muted/50 w-full relative">
<span class="absolute -top-3 -left-6 text-[10px] font-display text-gray-500 tabular-nums">260</span>
</div>
</div>
<!-- SVG Chart Line & Gradient -->
<svg class="absolute inset-0 h-full w-full" preserveaspectratio="none" viewbox="0 0 100 100">
<defs>
<lineargradient id="chart-gradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#c1f20d" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#c1f20d" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Gradient Fill -->
<polygon fill="url(#chart-gradient)" points="0,80 20,70 40,75 60,40 80,30 100,10 100,100 0,100"></polygon>
<!-- Primary Stroke -->
<polyline fill="none" points="0,80 20,70 40,75 60,40 80,30 100,10" stroke="#c1f20d" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
</svg>
<!-- Interactive Scrubber (Simulated Hover State) -->
<div class="absolute inset-y-0 w-px bg-muted hidden group-hover:block" style="left: 80%;">
<!-- Data Point Dot -->
<div class="absolute w-3 h-3 bg-background-dark border-2 border-primary rounded-full -ml-1.5" style="top: 30%;"></div>
<!-- Tooltip -->
<div class="absolute -top-8 -ml-10 w-20 bg-surface border border-muted rounded shadow-lg p-1.5 text-center">
<p class="text-[10px] font-display text-gray-400">OCT 14</p>
<p class="text-xs font-display font-bold text-text-main tabular-nums">305 LBS</p>
</div>
</div>
</div>
<!-- X-Axis Labels -->
<div class="flex justify-between mt-2 text-[10px] font-display text-gray-500 uppercase tracking-wider">
<span>Aug</span>
<span>Sep</span>
<span>Oct</span>
<span>Nov</span>
</div>
</div>
</div>
<!-- Stats Grid -->
<div class="px-6 grid grid-cols-2 gap-4">
<!-- Stat Card 1 -->
<div class="bg-surface border border-muted rounded-lg p-5">
<p class="text-xs font-display text-gray-400 uppercase tracking-widest mb-2">Total Volume</p>
<p class="font-display font-bold text-2xl text-text-main tabular-nums">14.2<span class="text-sm text-gray-500 ml-1">K</span></p>
</div>
<!-- Stat Card 2 -->
<div class="bg-surface border border-muted rounded-lg p-5">
<p class="text-xs font-display text-gray-400 uppercase tracking-widest mb-2">Workouts</p>
<p class="font-display font-bold text-2xl text-text-main tabular-nums">12</p>
</div>
<!-- Stat Card 3 -->
<div class="bg-surface border border-muted rounded-lg p-5">
<p class="text-xs font-display text-gray-400 uppercase tracking-widest mb-2">Avg Rest</p>
<p class="font-display font-bold text-2xl text-text-main tabular-nums">1:45<span class="text-sm text-gray-500 ml-1">M</span></p>
</div>
<!-- Stat Card 4 -->
<div class="bg-surface border border-muted rounded-lg p-5">
<p class="text-xs font-display text-gray-400 uppercase tracking-widest mb-2">PRs Set</p>
<p class="font-display font-bold text-2xl text-primary tabular-nums">3</p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component) -->
<div class="fixed bottom-0 w-full flex gap-2 border-t border-muted bg-surface px-4 pb-safe pt-2 z-50 pb-6">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500 hover:text-text-main transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">home</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center" style="font-variation-settings: 'FILL' 1;">
<span class="material-symbols-outlined text-2xl">show_chart</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500 hover:text-text-main transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">book</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500 hover:text-text-main transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">person</span>
</div>
</a>
</div>
</body></html>
